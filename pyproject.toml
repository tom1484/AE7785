[project]
name = "lfv"
version = "0.1.0"
description = "AE7785 final: YOLO sign *detector* for on-robot inference (ONNX + cv2.dnn at runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Runtime path on the ROS side is cv2.dnn only (team85_final/vision/detector.py).
    "numpy",
    "opencv-python",
    # Training / labeling only.
    "ultralytics",
    "onnx",
    "onnxslim",
    "onnxruntime",
    "pyyaml",
    "pandas",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# Zero-shot auto-boxing (OWLv2 / Grounding DINO) for bootstrapping labels.
label = ["transformers", "torch", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfv"]

[tool.ruff]
line-length = 100
