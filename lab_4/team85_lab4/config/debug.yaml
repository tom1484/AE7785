# Parameters for the debug nodes running on the host (launch/debug.launch.py).
# Shared robot parameters (e.g. path_radius) come from robot.yaml.
#
# Units: meters and radians. Write floats with a decimal point.

view_scan:
  ros__parameters:
    image_size: 800         # Window size (pixels)
    max_range: 3.5          # Distance drawn at the image border (m)

goal_monitor:
  ros__parameters:
    image_size: 480         # Map size (pixels); the text panel is added on the right
    margin: 0.5             # Space kept around waypoints and trajectory (m)
    trajectory_step: 0.01   # Minimum distance between trajectory points (m)

avoidance_monitor:
  ros__parameters:
    image_size: 480         # Map size (pixels); the text panel is added on the right
    max_range: 1.0          # Distance from the robot to the map border (m)
