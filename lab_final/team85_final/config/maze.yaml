# checked against the map image. Re-run the same command (+ --write) after remapping.
#   +---+---+---+---+---+---+
#   |       |               |      row 2 (north / +y)
#   +   +   +---+   +---+   +
#   |           |       |   |      row 1
#   +   +---+   +   +   +   +
#   |       |       |       |      row 0
#   +---+---+---+---+---+---+
#    col 0 ................ col 5  (+x)
rows: 3
cols: 6
cell_size: 0.9247
origin: [-0.5539, -2.1071]
yaw: 0.0
walls:
- [0, 1, E]
- [0, 1, N]
- [0, 3, E]
- [1, 2, E]
- [1, 2, N]
- [1, 4, E]
- [1, 4, N]
- [2, 1, E]
