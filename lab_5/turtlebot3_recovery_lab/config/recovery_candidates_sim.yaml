# Recovery waypoint candidates for the Gazebo 7785 maze, for map_sim.yaml.
# Same format as recovery_candidates.yaml (the real lab map); use this file
# only in simulation (recovery_sim.zsh passes it with -p candidates_file:=...).
#
# Generated from map_sim.pgm: corridor centers with at least 0.40 m of
# clearance from walls and unknown space, spaced at least 0.6 m apart.
# Point 0 is the spawn point (map origin).

frame_id: map

# Skip candidates closer than this to the robot (meters).
min_distance: 0.3

candidates:
  - {x: 0.024, y: 0.038}
  - {x: -0.076, y: 1.138}
  - {x: 0.024, y: 1.738}
